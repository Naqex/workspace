[mcp_servers.naqex_search]
command = "uv"
args = ["run", "--no-project", "--python", "3.12", "tooling/search/xerj.py", "mcp"]
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 30
enabled_tools = ["xerj_search", "xerj_def", "xerj_map"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 30
enabled_tools = ["resolve-library-id", "query-docs"]
