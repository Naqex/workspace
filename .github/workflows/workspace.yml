name: Workspace
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Workspace contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch all pinned Naqex products
        run: git submodule update --init -- projects/trader projects/vi-dubber projects/quant-trading projects/TradingAgents
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python tooling/check_workspace.py
      - run: python -m unittest discover -s tooling/tests -p test_check_workspace.py -v
      - run: python -m pip install -r tooling/github-workflow/requirements.txt
      - run: python tooling/github-workflow/check.py
      - run: python -m unittest discover -s tooling/github-workflow/tests -v
  secrets:
    name: Workspace secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - name: Verified pinned Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/naqex-tools"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/naqex-tools/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/naqex-tools/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP/naqex-tools"
          "$RUNNER_TEMP/naqex-tools/gitleaks" git --redact --no-banner --log-opts HEAD
  registry:
    name: Trader UI registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch pinned Trader consumer
        run: git submodule update --init -- projects/trader
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: node tooling/ui-qa/ui-registry-check.mjs --json
      - run: node --test tooling/ui-qa/tests/registered-products.test.mjs
