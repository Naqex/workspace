name: Workspace
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Workspace contracts
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch all pinned Naqex products and integrations
        run: git submodule update --init -- projects/trader projects/vi-dubber projects/quant-trading projects/integrations/TradingAgents projects/integrations/paperclip projects/integrations/rd-agent projects/integrations/hermes-agent
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            projects/trader/foundation_v2/uv.lock
            projects/trader/foundation_v2/engine_runtime/uv.lock
            projects/integrations/TradingAgents/uv.lock
            tooling/github-workflow/requirements.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install locked workspace and quant test dependencies via uv
        run: |
          python - <<'PY'
          import subprocess, tomllib
          from pathlib import Path

          trader_lock = tomllib.loads(Path("projects/trader/foundation_v2/uv.lock").read_text(encoding="utf-8"))
          pins = [
              f"{p['name']}=={p['version']}"
              for p in trader_lock["package"]
              if p["name"] in ("pydantic", "httpx")
          ]
          worker_lock = tomllib.loads(
              Path("projects/integrations/TradingAgents/uv.lock").read_text(encoding="utf-8")
          )
          pins += [
              f"{p['name']}=={p['version']}"
              for p in worker_lock["package"]
              if p["name"] == "openai"
          ]
          engine_lock = tomllib.loads(
              Path("projects/trader/foundation_v2/engine_runtime/uv.lock").read_text(encoding="utf-8")
          )
          pins += [
              f"{p['name']}=={p['version']}"
              for p in engine_lock["package"]
              if p["name"] in ("nautilus-trader", "pandas")
          ]
          pins += [
              "numpy==2.3.5",
              "statsmodels==0.15.0",
              "pyarrow==26.0.1",
              "zstandard==0.25.0",
              "numba==0.68.1",
              "duckdb==2.0.1",
              "ruff==0.17.6",
              "hypothesis==6.170.17",
              "pytest==9.2.0",
              "pytest-xdist==3.8.0",
          ]
          subprocess.run(
              ["uv", "pip", "install", "--system", "-r", "tooling/github-workflow/requirements.txt", *pins],
              check=True,
          )
          PY
      - name: Verify workspace contracts, skills, architecture, integrations & education
        env:
          PYTHONUTF8: "1"
        run: |
          python tooling/check_workspace.py
          python tooling/github-workflow/check.py
          python tooling/check_skill_links.py --skills-dir .agents/skills --review-triggers
          python tooling/check_architecture.py --strict
          node tooling/integrations/doctor.mjs
          python education/check_setup.py
      - name: Run unified offline pytest suite across all 5 testpaths
        env:
          PYTHONUTF8: "1"
          TEMP: ${{ runner.temp }}/quant-audit
          TMP: ${{ runner.temp }}/quant-audit
        run: |
          mkdir -p "$TEMP"
          python -X utf8 -m pytest -n auto --dist worksteal -m "not local_cache" \
            --junitxml="${{ runner.temp }}/pytest-workspace.xml" -q
      - name: Preserve workspace pytest timings and JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-pytest-report
          path: ${{ runner.temp }}/pytest-workspace.xml
      - name: Check anti-bloat budgets on changed raw artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "$BASE_SHA"
            python tooling/check_anti_bloat.py --base "$BASE_SHA"
          else
            python tooling/check_anti_bloat.py --base HEAD
          fi
  secrets:
    name: Workspace secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verified pinned Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/naqex-tools"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/naqex-tools/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/naqex-tools/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP/naqex-tools"
          "$RUNNER_TEMP/naqex-tools/gitleaks" git --redact --no-banner --verbose --log-opts HEAD
  registry:
    name: Trader UI registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch pinned Trader consumer
        run: git submodule update --init -- projects/trader
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node tooling/ui-qa/ui-registry-check.mjs --json
      - run: node --test tooling/ui-qa/tests/registered-products.test.mjs
